<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Sobat</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5B3DF5">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <script>
    // The web app lives at /app/ as a single page. A link to one of its
    // screens (/app/ride/...) lands here, so hand it to the app, which puts
    // the path back before it starts.
    if (location.pathname.indexOf('/app/') === 0) {
      location.replace('/app/?p=' + encodeURIComponent(location.pathname + location.search + location.hash));
    }
  </script>
</head>
<body>
  <main class="container narrow doc">
    <h1>This page took a wrong turn</h1>
    <p class="muted">The page you're looking for doesn't exist.</p>
    <p><a class="button" href="/">Go to the Sobat home page</a></p>
  </main>
</body>
</html>
