    <!-- Installable web app (getsobat.in/app): manifest, icons, iPhone home-screen tags. -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // A deep link (getsobat.in/app/ride/…) reaches GitHub Pages' 404 page,
      // which sends it here as /app/?p=<path>. Put the path back before the
      // app starts, so the router opens the right screen.
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p && p.indexOf('/app/') === 0) window.history.replaceState(null, '', p);
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Shown the moment the page arrives, until the app is ready (app/_layout.tsx
         removes it): a blank page while ~1 MB of code loads lost most visitors
         from Instagram ads. Colours from lib/theme.ts (brand). Hides itself
         after 20 s in case the app never starts, so an error isn't covered. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #5B3DF5; color: #fff; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; transition: opacity .25s; animation: boot-out .3s 20s forwards; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot b { font-size: 42px; font-weight: 800; letter-spacing: -1px; }
      #boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .3); border-top-color: #fff; animation: boot-spin .8s linear infinite; }
      #boot span { font-size: 15px; opacity: .85; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-out { to { opacity: 0; visibility: hidden; } }
    </style>
